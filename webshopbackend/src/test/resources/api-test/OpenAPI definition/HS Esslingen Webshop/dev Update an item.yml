info:
  name: dev Update an item
  type: http
  seq: 7
  tags:
    - HS Esslingen Webshop

http:
  method: PUT
  url: "{{baseUrl-dev}}/api-maowit00/item-management/v1/items/{{id}}"
  body:
    type: json
    data: |-
      {
        "title": "Principles of transaction processing",
        "description": "A clear and concise guide for anyone involved in developing applications",
        "price": 9.99,
        "availability": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Item updated
    request:
      url: "{{baseUrl}}/api-maowit00/item-management/v1/items/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "title": "Principles of transaction processing",
            "description": "A clear and concise guide for anyone involved in developing applications",
            "price": 9.99,
            "availability": 10
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1,
            "title": "Principles of transaction processing",
            "description": "A clear and concise guide for anyone involved in developing applications",
            "price": 9.99,
            "availability": 10
          }
  - name: 404 Response
    description: Item not found
    request:
      url: "{{baseUrl}}/api-maowit00/item-management/v1/items/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "title": "Principles of transaction processing",
            "description": "A clear and concise guide for anyone involved in developing applications",
            "price": 9.99,
            "availability": 10
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Updates an existing item by its ID and returns the updated item
