info:
  name: Get all items
  type: http
  seq: 4
  tags:
    - HS Esslingen Webshop

http:
  method: GET
  url: "{{baseUrl}}/api-maowit00/item-management/v1/items"
  params:
    - name: title
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Items found
    request:
      url: "{{baseUrl}}/api-maowit00/item-management/v1/items"
      method: GET
      params:
        - name: title
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "title": "Principles of transaction processing",
              "description": "A clear and concise guide for anyone involved in developing applications",
              "price": 9.99,
              "availability": 10
            }
          ]
  - name: 404 Response
    description: No items found
    request:
      url: "{{baseUrl}}/api-maowit00/item-management/v1/items"
      method: GET
      params:
        - name: title
          value: ""
          type: query
          disabled: true
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api-maowit00/item-management/v1/items"
      method: GET
      params:
        - name: title
          value: ""
          type: query
          disabled: true
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""

docs: Returns all items, optionally filtered by title
